# Fixed public HTTPS via Tailscale Funnel (https://<TS_HOSTNAME>.<tailnet>.ts.net).
# Usage: docker compose --env-file .env -f compose.yaml -f compose.tailscale.yaml up -d --wait
# Requires secrets/ts_authkey and IDENTITY_DOMAIN in .env set to the ts.net hostname.
services:
  tailscale:
    image: tailscale/tailscale:v1.86.2
    hostname: mongscape-faces
    restart: unless-stopped
    environment:
      TS_HOSTNAME: mongscape-faces
      TS_AUTHKEY: file:/run/secrets/ts_authkey
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    secrets:
      - ts_authkey
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    depends_on:
      identity:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  tailscale-state:
secrets:
  ts_authkey:
    file: ./secrets/ts_authkey
