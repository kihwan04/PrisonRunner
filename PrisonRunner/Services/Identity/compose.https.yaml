services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      IDENTITY_DOMAIN: "${IDENTITY_DOMAIN:?Set IDENTITY_DOMAIN to your real DNS hostname in .env}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      identity:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  caddy-data:
  caddy-config:
